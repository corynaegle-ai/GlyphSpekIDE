    d="M12 2.2 20 5.4V11.7C20 16.6 16.7 19.9 12 21.8 7.3 19.9 4 16.6 4 11.7V5.4L12 2.2ZM10.85 15.45 16 10.05 14.5 8.65 10.85 12.5 9.4 11 7.95 12.45 10.85 15.45Z"/>
</svg>
