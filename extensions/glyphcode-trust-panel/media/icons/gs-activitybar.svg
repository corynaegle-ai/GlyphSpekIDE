<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
  <!-- Solid GlyphCode verifier-shield for the activity bar. VS Code renders
       activity-bar icons as a single-color MASK, so this is a filled silhouette
       (a thin stroke line icon masks nearly invisibly). The check is an evenodd
       knockout so the shape reads as a verified shield. The line gs-verifier.svg
       stays the icon used inside the webviews. -->
