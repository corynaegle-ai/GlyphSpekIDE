<!DOCTYPE html>
<!--
  GlyphSpek MODEL CALLS / ACTORS rail surface — webview shell (Spec §5.9).

  Static template; modelCallsViewProvider.ts substitutes ${CSP}, ${STYLE_URI},
  ${SCRIPT_URI} and ${NONCE} at resolve time. CSP-locked (default-src 'none'),
  per-load nonce, no inline handlers, no external network. The provider posts a
  { type:'render', model } message; model-calls-view.js draws it with native DOM
  (no framework, no innerHTML of dynamic data). It fabricates NO data — an empty
  stream renders the honest empty state, never a fake "brokered" claim, and a
  boundary-only run is badged as boundary-observed, never as per-tool brokering.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="${CSP}" />
<link rel="stylesheet" href="${STYLE_URI}" nonce="${NONCE}" />
</head>
<body>
  <div class="surface-h"><span>Model Calls / Actors</span><span class="run-ref" id="runRef"></span></div>

  <!-- Bound actor(s): the actor driving the run + its honest fidelity label. -->
  <div class="sect-h"><span>Bound actor</span></div>
  <div id="actors"></div>

  <!-- Nonce-bound remote (iOS) approval marker — only shown when recorded. -->
  <div id="remoteApproval"></div>

  <!-- Observed model endpoints for the focused run. -->
  <div class="sect-h"><span>Observed model endpoints</span><span class="count" id="endpointCount">0</span></div>
  <div class="endpoints" id="endpoints"></div>

  <div class="foot" id="foot"></div>

  <script nonce="${NONCE}" src="${SCRIPT_URI}"></script>
</body>
</html>
