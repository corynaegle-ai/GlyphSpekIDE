<!DOCTYPE html>
<!--
  GlyphSpek ACTOR rail surface — webview shell (Spec §5.3 "pinned actor" / §5.9 "Bound actor").

  Static template; actorViewProvider.ts substitutes ${CSP}, ${STYLE_URI}, ${SCRIPT_URI}
  and ${NONCE} at resolve time. CSP-locked (default-src 'none'), per-load nonce, no inline
  handlers, no external network. The provider posts a { type:'render', model } message;
  actor-view.js draws it with native DOM (no framework, no innerHTML of untrusted data). It
  fabricates NO trust data — no focused run renders the honest empty state, never a fake
  bound-actor claim. The REBIND affordance is a read-only LABEL (no command is fired).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="${CSP}" />
<link rel="stylesheet" href="${STYLE_URI}" nonce="${NONCE}" />
</head>
<body>
  <div class="surface-h"><span>Bound Actor</span><span class="run-ref" id="runRef"></span></div>

  <!-- The pinned-actor chip: WHICH actor is bound + WHAT may it do (§5.3). Filled by
       actor-view.js so the honest sub-label / fidelity badge can vary per run. -->
  <div id="actorCard"></div>

  <!-- The unifying honesty line: the actor never gets raw tool access. Always present. -->
  <div id="brokered"></div>

  <!-- Posture cautions (governed-unsandboxed / non-isolated runtime), shown only when
       the focused run asserts them. -->
  <div id="cautions"></div>

  <div class="sect-h"><span>Granted capabilities (brokered)</span></div>
  <div class="caps" id="capabilities"></div>

  <!-- Rebind affordance — a read-only LABEL this increment, not a wired button. -->
  <div class="sect-h"><span>Rebind</span></div>
  <div id="rebind"></div>

  <div class="foot" id="foot"></div>

  <script nonce="${NONCE}" src="${SCRIPT_URI}"></script>
</body>
</html>
