<!DOCTYPE html>
<!--
  GlyphSpek EGRESS / NETWORK rail surface — webview shell (Spec §5.9 "Egress").

  Static template; egressViewProvider.ts substitutes ${CSP}, ${STYLE_URI}, ${SCRIPT_URI}
  and ${NONCE} at resolve time. CSP-locked (default-src 'none'), per-load nonce, no
  inline handlers, no external network. The provider posts a { type:'render', model }
  message; egress-view.js draws it with native DOM (no framework, no innerHTML of
  untrusted data). It fabricates NO trust data — an empty stream renders the honest
  empty state, never a fake "secure" claim.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="${CSP}" />
<link rel="stylesheet" href="${STYLE_URI}" nonce="${NONCE}" />
</head>
<body>
  <div class="surface-h"><span>Egress / Network</span><span class="run-ref" id="runRef"></span></div>

  <!-- Posture banner: filled by egress-view.js so the loopback caution can vary
       per run. The honest soft-vs-hard framing lives here. -->
  <div id="posture"></div>

  <!-- Loopback-bypass caution (F2) — only shown when the focused run asserts it. -->
  <div id="loopback"></div>

  <div class="sect-h"><span>Blocked attempts</span><span class="count" id="blockedCount">0</span></div>
  <div class="dests" id="blocked"></div>

  <div class="sect-h"><span>Observed / allowed this run</span><span class="count" id="allowedCount">0</span></div>
  <div class="dests" id="allowed"></div>

  <div class="foot" id="foot"></div>

  <script nonce="${NONCE}" src="${SCRIPT_URI}"></script>
</body>
</html>
